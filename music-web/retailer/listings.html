<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Retailer Console - MusicOnline</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">MusicOnline</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto" id="mainNavbar"></ul>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <div class="alert alert-info">
        <strong>Retailer Privileges</strong> You can list more items; promotion features will be available later.
    </div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>My Inventory</h2>
        <div>
            <a href="/user/dashboard.html" class="btn btn-outline-secondary me-2">Dashboard</a>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addModal">+ Add New Vinyl</button>
        </div>
    </div>
    <table class="table table-hover" id="listingsTable">
        <thead class="table-dark">
        <tr><th>Artist</th><th>Album</th><th>Price</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5>Add New Vinyl</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <form id="addForm">
                    <input type="text" class="form-control mb-2" placeholder="Artist" id="artist" required>
                    <input type="text" class="form-control mb-2" placeholder="Album Title" id="title" required>
                    <input type="date" class="form-control mb-2" id="releaseDate">
                    <input type="number" step="0.01" class="form-control mb-2" placeholder="Price" id="price" required>
                    <input type="text" class="form-control mb-2" placeholder="Genre" id="genre">
                    <textarea class="form-control mb-2" placeholder="Description" id="description"></textarea>
                    <button type="submit" class="btn btn-primary w-100">Submit</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="js/common.js"></script>
<script>
    (async function() {
        try {
            await api.get('/menu');
        } catch (e) {}
    })();

    async function loadRetailerListings() {
        const res = await api.get('/vinyls/mine?page=1&size=50');
        if (res.data.code === 200) {
            const rows = res.data.data.records;
            const tbody = $('#listingsTable tbody');
            tbody.empty();
            rows.forEach(v => {
                tbody.append(`
                        <tr>
                            <td>${escapeHtml(v.artist)}</td><td>${escapeHtml(v.title)}</td>
                            <td>$${v.price}</td>
                            <td><span class="badge ${v.status === 'listed' ? 'bg-success' : 'bg-secondary'}">${v.status}</span></td>
                            <td>
                                <button class="btn btn-sm btn-warning edit-placeholder" disabled>Edit</button>
                                <button class="btn btn-sm btn-danger delete-btn" data-id="${v.id}">Delete</button>
                                ${v.status === 'listed' ?
                    `<button class="btn btn-sm btn-secondary unlist-btn" data-id="${v.id}">Unlist</button>` :
                    `<button class="btn btn-sm btn-success relist-btn" data-id="${v.id}">Relist</button>`}
                            </td>
                        </tr>
                    `);
            });
        }
    }

    $('#addForm').on('submit', async function(e) {
        e.preventDefault();
        const data = {
            artist: $('#artist').val(),
            title: $('#title').val(),
            releaseDate: $('#releaseDate').val(),
            price: parseFloat($('#price').val()),
            genre: $('#genre').val(),
            description: $('#description').val()
        };
        await api.post('/vinyls', data);
        alert('Listing added');
        $('#addModal').modal('hide');
        loadRetailerListings();
    });

    $(document).on('click', '.delete-btn', async function() {
        if (confirm('Permanently delete this listing?')) {
            const id = $(this).data('id');
            await api.delete(`/vinyls/${id}`);
            loadRetailerListings();
        }
    });
    $(document).on('click', '.unlist-btn', async function() {
        const id = $(this).data('id');
        await api.patch(`/vinyls/${id}/status?status=unlisted`);
        loadRetailerListings();
    });
    $(document).on('click', '.relist-btn', async function() {
        const id = $(this).data('id');
        await api.patch(`/vinyls/${id}/status?status=listed`);
        loadRetailerListings();
    });
    loadRetailerListings();
</script>
</body>
</html>
