<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MusicOnline</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{background-color:#f8f9fa;font-family:'Segoe UI',Roboto,system-ui,sans-serif}
        .container{max-width:550px;margin-top:80px}
        .card-header.bg-success{background-color:#198754 !important}
    </style>
</head>
<body class="bg-light">
<div class="container">
    <div class="card shadow">
        <div class="card-header bg-success text-white">Sign Up for MusicOnline</div>
        <div class="card-body">
            <form id="registerForm">
                <div class="mb-3"><label>Username *</label><input type="text" id="username" class="form-control" required minlength="3" maxlength="20"><div class="form-text">3-20 characters, alphanumeric</div></div>
                <div class="mb-3"><label>Email *</label><input type="email" id="email" class="form-control" required></div>
                <div class="mb-3"><label>Password *</label><input type="password" id="password" class="form-control" required minlength="6"></div>
                <div class="mb-3"><label>Confirm Password *</label><input type="password" id="confirmPassword" class="form-control" required></div>
                <div class="mb-3 form-check"><input type="checkbox" id="isRetailer" class="form-check-input"><label class="form-check-label">I am a retailer (paid registration required)</label><div class="form-text text-muted small">Payment integration not available in prototype.</div></div>
                <button type="submit" class="btn btn-success w-100">Register</button>
            </form>
            <div class="mt-3 text-center"><a href="login.html">Already have an account? Login</a></div>
        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    const api = axios.create({
        baseURL: 'http://localhost:8080/api/v1',
        timeout: 10000,
        withCredentials: true
    });
    $('#registerForm').on('submit', async function(e) {
        e.preventDefault();
        const pwd = $('#password').val();
        const confirm = $('#confirmPassword').val();
        if (pwd !== confirm) { alert('Passwords do not match'); return; }
        const data = {
            username: $('#username').val(),
            email: $('#email').val(),
            password: pwd,
            isRetailer: $('#isRetailer').is(':checked')
        };
        try {
            const res = await api.post('/auth/register', data);
            if (res.data.code === 200) {
                alert('Registration successful! Please log in.');
                window.location.href = 'login.html';
            } else {
                alert(res.data.message || 'Registration failed');
            }
        } catch (err) {
            const msg = err.response?.data?.message || err.response?.data?.error || 'Registration failed';
            alert(msg);
        }
    });
</script>
</body>
</html>
