<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MusicOnline</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">MusicOnline</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto" id="mainNavbar"></ul>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <div class="row">
        <div class="col-md-3">
            <div class="list-group">
                <a href="/user/dashboard.html" class="list-group-item list-group-item-action active">Profile</a>
                <a href="/user/my-listings.html" class="list-group-item list-group-item-action">My Listings</a>
            </div>
        </div>
        <div class="col-md-9">
            <div class="card">
                <div class="card-header">Account Information</div>
                <div class="card-body" id="profileContent">
                    <div class="spinner-border text-primary" role="status"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="js/common.js"></script>
<script>
    (async function() {
        try {
            await api.get('/menu');
        } catch (e) {}
    })();

    async function loadProfile() {
        try {
            const res = await api.get('/menu');
            if (res.data.code === 200) {
                $('#profileContent').html(`
                        <p><strong>Username:</strong> Current logged-in user</p>
                        <p><strong>Role:</strong> ${res.data.data.length > 0 ? 'Authenticated' : 'Guest'}</p>
                        <hr>
                        <p class="text-muted">Profile details coming soon. You can <a href="/user/my-listings.html">manage your vinyl listings</a>.</p>
                    `);
            } else {
                throw new Error('Not logged in');
            }
        } catch (err) {
            $('#profileContent').html(`
                    <div class="alert alert-warning">Please <a href="/login.html">login</a> to view your dashboard.</div>
                `);
        }
    }
    loadProfile();
</script>
</body>
</html>
