<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Listings - MusicOnline</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        .container {
            margin-top: 2rem;
        }
        .table th {
            background-color: #212529;
            color: white;
        }
        .btn-group-sm .btn {
            margin-right: 4px;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">MusicOnline</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto" id="mainNavbar"></ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>My Vinyl Listings</h2>
        <div>
            <a href="/user/dashboard.html" class="btn btn-outline-secondary me-2">Dashboard</a>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addModal">+ Add New Vinyl</button>
        </div>
    </div>
    <table class="table table-bordered" id="listingsTable">
        <thead>
        <tr><th>Artist</th><th>Album Title</th><th>Price</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Vinyl</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addForm">
                    <input type="text" class="form-control mb-2" placeholder="Artist" id="artist" required>
                    <input type="text" class="form-control mb-2" placeholder="Album Title" id="title" required>
                    <input type="date" class="form-control mb-2" id="releaseDate">
                    <input type="number" step="0.01" class="form-control mb-2" placeholder="Price" id="price" required>
                    <input type="text" class="form-control mb-2" placeholder="Genre" id="genre">
                    <textarea class="form-control mb-2" placeholder="Description" id="description"></textarea>
                    <button type="submit" class="btn btn-primary w-100">Submit</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
    const api = axios.create({
        baseURL: 'http://localhost:8080/api/v1',
        timeout: 10000,
        withCredentials: true
    });

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    api.interceptors.response.use(
        response => response,
        error => {
            if (error.response && error.response.status === 401) {
                sessionStorage.removeItem('userRole');
                window.location.href = '/login.html';
            }
            return Promise.reject(error);
        }
    );

    function loadListings() {
        api.get('/vinyls/mine?page=1&size=50').then(res => {
            if (res.data.code === 200) {
                const records = res.data.data.records || [];
                const tbody = $('#listingsTable tbody');
                tbody.empty();
                records.forEach(v => {
                    tbody.append(`
                        <tr>
                            <td>${escapeHtml(v.artist)}</td>
                            <td>${escapeHtml(v.title)}</td>
                            <td>$${v.price}</td>
                            <td>${v.status}</td>
                            <td>
                                <button class="btn btn-sm btn-warning edit-btn" data-id="${v.id}" disabled>Edit</button>
                                <button class="btn btn-sm btn-danger delete-btn" data-id="${v.id}">Delete</button>
                                ${v.status === 'listed' ?
                        `<button class="btn btn-sm btn-secondary unlist-btn" data-id="${v.id}">Unlist</button>` :
                        `<button class="btn btn-sm btn-success relist-btn" data-id="${v.id}">Relist</button>`}
                            </td>
                        </tr>
                    `);
                });
            } else {
                $('#listingsTable tbody').html('<tr><td colspan="5">Failed to load listings.</td></tr>');
            }
        }).catch(err => {
            console.error(err);
            $('#listingsTable tbody').html('<tr><td colspan="5">Error loading listings.</td></tr>');
        });
    }

    $('#addForm').on('submit', async function(e) {
        e.preventDefault();
        const data = {
            artist: $('#artist').val().trim(),
            title: $('#title').val().trim(),
            releaseDate: $('#releaseDate').val() || null,
            price: parseFloat($('#price').val()),
            genre: $('#genre').val().trim() || null,
            description: $('#description').val().trim() || null
        };
        if (!data.artist || !data.title || isNaN(data.price)) {
            alert('Artist, Title and Price are required.');
            return;
        }
        try {
            const res = await api.post('/vinyls', data);
            if (res.data.code === 200) {
                alert('Vinyl added successfully!');
                $('#addModal').modal('hide');
                $('#addForm')[0].reset();
                loadListings();
            } else {
                alert(res.data.message || 'Failed to add vinyl.');
            }
        } catch (err) {
            const msg = err.response?.data?.message || err.response?.data?.error || 'Add failed.';
            alert(msg);
        }
    });

    $(document).on('click', '.delete-btn', async function() {
        const id = $(this).data('id');
        if (confirm('Are you sure you want to permanently delete this listing?')) {
            try {
                const res = await api.delete(`/vinyls/${id}`);
                if (res.data.code === 200) {
                    alert('Deleted.');
                    loadListings();
                } else {
                    alert(res.data.message || 'Delete failed.');
                }
            } catch (err) {
                alert(err.response?.data?.message || 'Delete error.');
            }
        }
    });

    $(document).on('click', '.unlist-btn', async function() {
        const id = $(this).data('id');
        try {
            const res = await api.patch(`/vinyls/${id}/status?status=unlisted`);
            if (res.data.code === 200) {
                alert('Unlisted.');
                loadListings();
            } else {
                alert(res.data.message || 'Operation failed.');
            }
        } catch (err) {
            alert(err.response?.data?.message || 'Error.');
        }
    });

    $(document).on('click', '.relist-btn', async function() {
        const id = $(this).data('id');
        try {
            const res = await api.patch(`/vinyls/${id}/status?status=listed`);
            if (res.data.code === 200) {
                alert('Relisted.');
                loadListings();
            } else {
                alert(res.data.message || 'Operation failed.');
            }
        } catch (err) {
            alert(err.response?.data?.message || 'Error.');
        }
    });

    $(document).ready(function() {
        const role = sessionStorage.getItem('userRole');
        const $navbar = $('#mainNavbar');
        if ($navbar.length) {
            $navbar.html(`
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/search.html">Discover</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">My Account</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/user/dashboard.html">Dashboard</a></li>
                        <li><a class="dropdown-item" href="/user/my-listings.html">My Listings</a></li>
                        ${role === 'retailer' ? '<li><a class="dropdown-item" href="/retailer/listings.html">Retailer Console</a></li>' : ''}
                        ${role === 'admin' ? '<li><a class="dropdown-item" href="/admin/dashboard.html">Admin Panel</a></li>' : ''}
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#" id="logoutBtn">Logout</a></li>
                    </ul>
                </li>
            `);
            $('#logoutBtn').on('click', async () => {
                await api.post('/auth/logout');
                sessionStorage.removeItem('userRole');
                window.location.href = '/login.html';
            });
        }
        loadListings();
    });
</script>
</body>
</html>
