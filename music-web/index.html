<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicOnline - Vinyl Trading Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">MusicOnline</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto" id="mainNavbar"></ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="jumbotron bg-light p-5 rounded">
        <h1>Welcome to MusicOnline</h1>
        <p>Discover, share and trade your favorite vinyl records</p>
        <a href="/search.html" class="btn btn-primary btn-lg">Browse Vinyls</a>
    </div>

    <h2 class="mt-5">Featured Vinyls</h2>
    <div id="vinylList" class="row row-cols-1 row-cols-md-3 g-4"></div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="js/common.js"></script>
<script>
    $(document).ready(function() {
        api.get('/vinyls?page=1&size=6').then(res => {
            if (res.data.code === 200) {
                const records = res.data.data.records || [];
                const $container = $('#vinylList');
                $container.empty();
                records.forEach(vinyl => {
                    $container.append(`
                            <div class="col">
                                <div class="card h-100">
                                    <img src="${vinyl.coverImagePath || '/images/placeholder.jpg'}" class="card-img-top" alt="Cover">
                                    <div class="card-body">
                                        <h5 class="card-title">${escapeHtml(vinyl.title)}</h5>
                                        <p class="card-text">${escapeHtml(vinyl.artist)} - $${vinyl.price}</p>
                                        <a href="/vinyl-detail.html?id=${vinyl.id}" class="btn btn-sm btn-outline-primary">Details</a>
                                    </div>
                                </div>
                            </div>
                        `);
                });
            }
        });
    });
</script>
</body>
</html>
