<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vinyl Moderation - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
</head>
<body>
<div class="container mt-3">
    <div class="d-flex justify-content-between">
        <h3>All Vinyl Records</h3>
        <a href="/admin/dashboard.html" class="btn btn-secondary">Back to Dashboard</a>
    </div>
    <table class="table table-striped mt-3">
        <thead><tr><th>ID</th><th>Artist</th><th>Title</th><th>Seller ID</th><th>Status</th><th>Action</th></tr></thead>
        <tbody id="vinylsBody"></tbody>
    </table>
    <nav><ul class="pagination" id="vinylPagination"></ul></nav>
</div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="js/common.js"></script>
<script>
    (async function() {
        try {
            await api.get('/admin/vinyls');
        } catch (e) {
            window.location.href = '/login.html';
        }
    })();

    let currentPage = 1;
    async function loadVinyls(page=1) {
        const res = await api.get(`/admin/vinyls?page=${page}&size=10`);
        if (res.data.code === 200) {
            const data = res.data.data;
            const tbody = $('#vinylsBody');
            tbody.empty();
            data.records.forEach(v => {
                tbody.append(`
                        <tr>
                            <td>${v.id}</td><td>${escapeHtml(v.artist)}</td><td>${escapeHtml(v.title)}</td>
                            <td>${v.sellerId}</td><td>${v.status}</td>
                            <td>${v.status !== 'unlisted' ? `<button class="btn btn-sm btn-danger hide-btn" data-id="${v.id}">Force Unlist</button>` : 'Already off-shelf'}</td>
                        </tr>
                    `);
            });
            let pagHtml = '';
            for (let i=1; i<=Math.ceil(data.total/10); i++) {
                pagHtml += `<li class="page-item ${i===page?'active':''}"><a class="page-link" href="#" data-page="${i}">${i}</a></li>`;
            }
            $('#vinylPagination').html(pagHtml);
            $('.page-link[data-page]').on('click', function(e) {
                e.preventDefault();
                currentPage = parseInt($(this).data('page'));
                loadVinyls(currentPage);
            });
        }
    }
    $(document).on('click', '.hide-btn', async function() {
        const id = $(this).data('id');
        if (confirm('Force unlist this vinyl? It will be hidden from search.')) {
            await api.patch(`/admin/vinyls/${id}/hide`);
            loadVinyls(currentPage);
        }
    });
    loadVinyls();
</script>
</body>
</html>
