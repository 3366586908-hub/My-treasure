<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar {background:#1f2937; color:white; min-height:100vh; padding:1rem;}
        .sidebar a {color:white; display:block; padding:0.7rem; margin-bottom:0.3rem; border-radius:4px; text-decoration:none;}
        .sidebar a:hover {background:#374151;}
        .content {padding:2rem;}
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-2 sidebar">
            <h5>Menu</h5>
            <a href="dashboard.html?role=coach">Dashboard</a>
            <a href="player-profile.html">Player Profile</a>
            <a href="#">Team Management</a>
            <a href="#">Training</a>
            <a href="login.html">Logout</a>
        </div>
        <div class="col-md-10 content">
            <h3>Player Profile</h3>
            <form id="playerForm" class="needs-validation" novalidate>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" required>
                        <div class="invalid-feedback">Required</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" class="form-control" required>
                        <div class="invalid-feedback">Required</div>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Emergency Contact</label>
                        <input type="text" class="form-control" required>
                        <div class="invalid-feedback">Required</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Medical Info</label>
                        <input type="text" class="form-control">
                    </div>
                </div>
                <button class="btn btn-primary" type="submit">Save</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const form = document.getElementById('playerForm');
    form.addEventListener('submit', e => {
        if (!form.checkValidity()) { e.preventDefault(); e.stopPropagation(); }
        form.classList.add('was-validated');
    });
</script>
</body>
</html>
