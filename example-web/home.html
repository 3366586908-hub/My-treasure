<!-- 修改密码模态框 -->
<div class="modal fade" tabindex="-1" id="changePasswordModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="changePasswordForm">

            <!-- 模态框头部 -->
            <div class="modal-header">
                <h4 class="modal-title">Change Password</h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <!-- 模态框内容 -->
            <div class="modal-body">
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="oldPassword" name="oldPassword" placeholder="Password"
                           minlength="6" required>
                    <label for="oldPassword"><i class="bi bi-lock me-1"></i>New Password</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="newPassword" name="newPassword" placeholder="Password"
                           minlength="6" required>
                    <label for="newPassword"><i class="bi bi-lock me-1"></i>New Password</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="confirm" placeholder="Repeat Password"
                           required>
                    <label for="confirm"><i class="bi bi-shield-lock me-1"></i> Confirm New Password</label>
                </div>
            </div>

            <!-- 模态框底部 -->
            <div class="modal-footer">
                <button type="submit" class="btn btn-primary">Save</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
            </form>
        </div>
    </div>
</div>
<script>
    getLoginUserInfo();

    function getLoginUserInfo(){
        $.ajax({
            url:'http://localhost:8003/user/getLoginUserInfo',
            type:'GET',
            headers: {Authorization: `Bearer ${localStorage.getItem('token')}`},
            success:function (res){
                if (res.code === 200){
                    $('#login a img').attr('src',res.data.avatar);
                    $('#login a strong').text(res.data.nickName);

                }else{
                    window.location = 'index.html';
                }
            },
            error:function (err){
                window.location = 'index.html';
            }
        });
    }

    $('#signOut').on('click',function(e){
        localStorage.removeItem('token');
        window.location = 'index.html';
    })

    $(document).on('click','.menu-item',function(e){
        //禁止自动提交href去自动跳转
        e.preventDefault();
        $('.menu-item').removeClass('active');
        $(this).addClass('active');

        //$(this)代表当前点击的是按一个a标签，data('url')指的是a标签内自定义的data-url
        const url=$(this).data('url');

        const title =$(this).data('title');

        const parent =$(this).data('parent');

        $('#breadcrumbCurrent').text(title);
        if (parent){
            $('#breadcrumbParent').text(parent);
        }else {
            $('#breadcrumbParent').text(title);
        }

        if (url) {
            $('#mainBody').load(url);
        }
    })

    $('#changePasswordForm').on('submit',function (e){
        e.preventDefault();
        $.ajax({
            url:'http://localhost:8003/user/changePassword',
            type: 'POST',
            headers: {Authorization: `Bearer ${localStorage.getItem('token')}`},
            data:$(this).serialize(),
            success:function (res){
                if (res.code === 200){
                    localStorage.removeItem('token');
                    window.location = 'login.html';
                }else{
                    alert(res.message);
                }
            },
            error: function (err){
                alert('Change Error!');
            }
        });
        let changePasswordModal = bootstrap.Modal.getInstance($('#changePasswordModal')[0]);
        changePasswordModal.hide();
    })
</script>
